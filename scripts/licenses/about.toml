# cargo-about's configuration, for THIRD-PARTY-LICENSES.md in the CLI archives
# and the wheels (docs/releasing.md):
#
#     cargo about generate -c scripts/licenses/about.toml \
#       -m crates/xeibe-cli/Cargo.toml --features object-store \
#       scripts/licenses/about.hbs -o THIRD-PARTY-LICENSES.md

# The licences a dependency may use. Where a crate offers a choice, the first
# of these that it offers is the one listed. A dependency under any other
# licence fails the generation, and so the release.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# The release targets: platform-only dependencies (windows-sys, libc, …) of
# any of them are listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Only what is compiled into the shipped binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The EPSG Dataset's terms of use have no SPDX identifier. Its notice,
# xeibe-crs/EPSG-NOTICE.md, ships next to this file in the archives and as
# NOTICE.md in the wheels, so cargo-about has no text to list for it (and
# says so in a warning). xeibe-proj-py's licence names it for the data it
# embeds.
[xeibe-crs]
accepted = ["LicenseRef-EPSG"]

[xeibe-proj-py]
accepted = ["LicenseRef-EPSG"]
