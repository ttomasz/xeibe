[workspace]
resolver = "3"
members = [
    "crates/xeibe-core",
    "crates/xeibe-crs",
    "crates/xeibe-geom",
    "crates/xeibe-schema",
    "crates/xeibe-arrow",
    "crates/xeibe-io",
    "crates/xeibe-wfs",
    "crates/xeibe-datafusion",
    "crates/xeibe-cli",
    "crates/xeibe-py",
    "crates/xeibe-testkit",
]
# xeibe-datafusion and xeibe-py pull in heavy dependencies (DataFusion, pyo3);
# build them explicitly with `-p` or `--workspace`.
default-members = [
    "crates/xeibe-core",
    "crates/xeibe-crs",
    "crates/xeibe-geom",
    "crates/xeibe-schema",
    "crates/xeibe-arrow",
    "crates/xeibe-io",
    "crates/xeibe-wfs",
    "crates/xeibe-cli",
    "crates/xeibe-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# geoarrow-array/geoarrow-schema 0.9 need 1.95 (DataFusion 55 needs 1.94).
rust-version = "1.95"
license = "CC0-1.0"
publish = false

[workspace.dependencies]
xeibe-core = { path = "crates/xeibe-core" }
xeibe-crs = { path = "crates/xeibe-crs" }
xeibe-geom = { path = "crates/xeibe-geom" }
xeibe-schema = { path = "crates/xeibe-schema" }
xeibe-arrow = { path = "crates/xeibe-arrow" }
xeibe-io = { path = "crates/xeibe-io", default-features = false }
xeibe-wfs = { path = "crates/xeibe-wfs" }
xeibe-datafusion = { path = "crates/xeibe-datafusion" }
xeibe-testkit = { path = "crates/xeibe-testkit" }

# Arrow is pinned to 59: geoarrow-array 0.9 and datafusion 55 both depend on arrow ^59.
arrow-array = "59"
arrow-buffer = "59"
arrow-select = "59"
arrow-ipc = "59"
arrow-schema = { version = "59", features = ["serde"] }
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "geospatial"] }
geoarrow-array = "0.9"
geoarrow-schema = "0.9"
geo-traits = "0.3"
wkb = "0.9"
datafusion = "55"

quick-xml = "0.42"
memchr = "2"
encoding_rs = "0.8"
flate2 = "1"
zstd = "0.13"
fast-float2 = "0.2"
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
globset = "0.4"
crossbeam-channel = "0.5"
# `rustls-no-provider` + `rustls/ring`: object_store (through reqwest 0.12) already
# brings ring, so reqwest 0.13's default aws-lc-rs would be a second crypto
# library, and one that needs CMake and a C toolchain to build.
# `xeibe_io::http::HttpClient::new` installs ring as the process default.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "gzip", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
# Reading only: `deflate` would also bring the zopfli encoder.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
object_store = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
# Arrow objects for Python (arro3), built on the same arrow and pyo3 versions.
# No `buffer_protocol`: xeibe hands no buffers to Python.
pyo3-arrow = { version = "0.19", default-features = false }

# Everyday builds and benchmarks. Line tables give readable profiler stacks at
# no runtime cost.
[profile.release]
debug = "line-tables-only"

# Shipped binaries and wheels: `cargo build --profile dist`, `maturin build
# --profile dist`. About 10% faster than `release` and a third smaller, for a
# much slower build. Panics must keep unwinding: the pipeline catches worker
# panics and pyo3 turns them into Python exceptions.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
