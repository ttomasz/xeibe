[package]
name = "xeibe-io"
description = "HTTP(S) and object-store (S3, GCS, Azure) byte sources for xeibe, each read as one sequential stream. Experimental: AI-generated, not thoroughly tested, unstable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["gml", "http", "object-store", "gis"]
categories = ["science::geo"]
license.workspace = true
publish.workspace = true

[features]
default = ["http"]
http = ["dep:reqwest", "dep:rustls"]
# S3/GCS/Azure/HTTP via `object_store`; needs a tokio runtime (bridged to sync reads).
object-store = ["dep:object_store", "object_store/aws", "object_store/gcp", "object_store/azure", "dep:tokio", "dep:futures-util", "dep:globset"]

[dependencies]
xeibe-core.workspace = true
bytes.workspace = true
url.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
# `sync` for the bounded channel between the async body and the synchronous reader.
tokio = { workspace = true, optional = true, features = ["sync"] }
# Polls `object_store`'s body and listing streams; already a dependency of `object_store`.
futures-util = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
