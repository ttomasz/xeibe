[package]
name = "xeibe-core"
description = "Streaming GML reading primitives for xeibe: byte sources, compression and zip, encodings, namespaces, GML version detection, splitting documents into features. Experimental: AI-generated, not thoroughly tested, unstable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["gml", "xml", "gis", "streaming"]
categories = ["science::geo", "parser-implementations"]
license.workspace = true
publish.workspace = true

[dependencies]
quick-xml.workspace = true
memchr.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
zstd.workspace = true
zip.workspace = true
deflate64.workspace = true
bytes.workspace = true
# `rc`: `QName` serializes its `Arc<str>` fields.
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true
globset.workspace = true

[dev-dependencies]
xeibe-testkit.workspace = true
