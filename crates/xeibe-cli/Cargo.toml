[package]
name = "xeibe-cli"
description = "The xeibe command: list the layers and inferred schemas of GML files and WFS services, convert a layer to (Geo)Parquet or Arrow IPC. Experimental: AI-generated, not thoroughly tested, unstable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["gml", "wfs", "parquet", "geoparquet", "gis"]
categories = ["command-line-utilities", "science::geo"]
license.workspace = true
publish.workspace = true

[features]
# s3://, gs://, az:// inputs.
object-store = ["xeibe-io/object-store"]

[[bin]]
name = "xeibe"
path = "src/main.rs"

[dependencies]
xeibe-core.workspace = true
xeibe-crs.workspace = true
xeibe-geom.workspace = true
xeibe-schema.workspace = true
xeibe-arrow.workspace = true
xeibe-export = { workspace = true, features = ["parquet", "ipc"] }
xeibe-io = { workspace = true, features = ["http"] }
xeibe-wfs.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
clap.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
arrow-ipc.workspace = true
zip.workspace = true
