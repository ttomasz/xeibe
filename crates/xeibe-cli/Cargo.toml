[package]
name = "xeibe-cli"
description = "xeibe: scan layers and schemas, convert one layer to Parquet/Arrow IPC, read WFS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# s3://, gs://, az:// inputs.
object-store = ["xeibe-io/object-store"]

[[bin]]
name = "xeibe"
path = "src/main.rs"

[dependencies]
xeibe-core.workspace = true
xeibe-geom.workspace = true
xeibe-schema.workspace = true
xeibe-arrow.workspace = true
xeibe-io = { workspace = true, features = ["http"] }
xeibe-wfs.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
geoarrow-array.workspace = true
geoarrow-schema.workspace = true
parquet.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
parquet.workspace = true
serde_json.workspace = true
zip.workspace = true
