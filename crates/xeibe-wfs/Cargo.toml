[package]
name = "xeibe-wfs"
description = "OGC WFS 1.0/1.1/2.0 bulk-read client for xeibe: capabilities, paging, pages streamed into one Arrow read. Experimental: AI-generated, not thoroughly tested, unstable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["wfs", "ogc", "gml", "gis"]
categories = ["science::geo", "web-programming::http-client"]
license.workspace = true
publish.workspace = true

[features]
default = ["http"]
# Without `http`, only capabilities/response parsing and request building are available.
http = ["xeibe-io/http"]

[dependencies]
xeibe-core.workspace = true
xeibe-io.workspace = true
# Capabilities and exception reports need prefix resolution in text content
# (`<Name>ms:AD.Address</Name>`), which `xeibe_core::reader` does not expose.
quick-xml.workspace = true
url.workspace = true
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
xeibe-testkit.workspace = true
# gzip response bodies for the HTTP tests.
flate2.workspace = true
