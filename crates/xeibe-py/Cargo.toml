[package]
name = "xeibe-py"
description = "Python bindings: scan() and read(), layers exposed via the Arrow PyCapsule stream interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "xeibe"
crate-type = ["cdylib"]

[dependencies]
xeibe-core.workspace = true
xeibe-schema.workspace = true
xeibe-arrow.workspace = true
# Paths, globs, zip members, HTTP(S) and object-store URLs.
xeibe-io = { workspace = true, features = ["http", "object-store"] }
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true, features = ["ffi"] }
pyo3.workspace = true
serde_json.workspace = true
