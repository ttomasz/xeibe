[package]
name = "xeibe-datafusion"
description = "DataFusion integration: a table per GML layer, read_gml() table function (SedonaDB-ready)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xeibe-core.workspace = true
xeibe-geom.workspace = true
xeibe-schema.workspace = true
xeibe-arrow.workspace = true
# `object-store`: the adapter from a registered `ObjectStore` to `ByteSource`.
xeibe-io = { workspace = true, features = ["object-store"] }
datafusion.workspace = true
object_store.workspace = true
tokio.workspace = true
async-trait = "0.1"

[dev-dependencies]
xeibe-testkit.workspace = true
tokio = { workspace = true, features = ["macros"] }
