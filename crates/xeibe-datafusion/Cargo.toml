[package]
name = "xeibe-datafusion"
description = "DataFusion integration for xeibe: a table provider per GML layer and a read_gml() table function. Experimental: AI-generated, not thoroughly tested, unstable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["gml", "datafusion", "geoarrow", "sql", "gis"]
categories = ["science::geo", "database"]
license.workspace = true
publish.workspace = true

[dependencies]
xeibe-core.workspace = true
xeibe-geom.workspace = true
xeibe-schema.workspace = true
xeibe-arrow.workspace = true
# `object-store`: the adapter from a registered `ObjectStore` to `ByteSource`.
xeibe-io = { workspace = true, features = ["object-store"] }
datafusion.workspace = true
object_store.workspace = true
tokio.workspace = true
async-trait.workspace = true

[dev-dependencies]
xeibe-testkit.workspace = true
tokio = { workspace = true, features = ["macros"] }
