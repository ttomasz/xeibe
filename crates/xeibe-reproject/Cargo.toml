[package]
name = "xeibe-reproject"
description = "Pure-Rust coordinate conversion between EPSG coordinate reference systems, driven by the PROJJSON in xeibe-crs. Experimental: AI-generated, not thoroughly tested, unstable API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["epsg", "crs", "projection", "reprojection", "gis"]
categories = ["science::geo", "mathematics"]
# Some of the projection code is ported from PROJ, which is MIT; see
# PROJ-NOTICE.md. Everything else is CC0 like the rest of the workspace.
license = "CC0-1.0 AND MIT"
publish.workspace = true

[features]
default = ["esri", "arrow"]
# Esri's names of EPSG objects, for reading ESRI WKT (docs/crs-wkt.md).
# xeibe-esri's data is Apache-2.0; without it, ESRI names are matched to
# EPSG's by normalising them only.
esri = ["dep:xeibe-esri"]
# GeoArrow arrays converted in their own layout (`arrow`, for
# xeibe_proj.arrow; docs/pyproj-phase3.md, GeoArrow). Only xeibe-proj-py
# turns it on in the workspace.
arrow = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema"]

[dependencies]
xeibe-crs.workspace = true
xeibe-esri = { workspace = true, optional = true }
flate2.workspace = true
arrow-array = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
xeibe-testkit.workspace = true
criterion.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

# The benchmarks are Criterion's (docs/benchmarks.md); the library has none
# of libtest's, which would reject Criterion's flags.
[lib]
bench = false

[[bench]]
name = "reproject"
harness = false
