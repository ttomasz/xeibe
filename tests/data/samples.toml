# Curated test samples. Built by scripts/corpus/build_samples.py, which extracts
# each sample from example_data/, validates it, records GDAL's reference output
# and regenerates samples.json + BOM.md.
#
# Every entry needs a reviewed licence. Fields filled automatically: the download
# URL and retrieval time (from example_data/downloads/log.jsonl or
# example_data/wfs/requests.tsv), sha256, size, validation and GDAL results.

[defaults]
gdal_image = "ghcr.io/osgeo/gdal:ubuntu-full-3.13.3"

# ---------------------------------------------------------------- licences
[licences.cc-by-4]
name = "Creative Commons Attribution 4.0 International (CC BY 4.0)"
url = "https://creativecommons.org/licenses/by/4.0/"

[licences.cc-by-sa-3-ee]
name = "Creative Commons Attribution-ShareAlike 3.0 Estonia (CC BY-SA 3.0 EE) – excerpts stay under this licence"
url = "https://creativecommons.org/licenses/by-sa/3.0/ee/legalcode"

[licences.etalab-2]
name = "Licence Ouverte / Open Licence 2.0 (Etalab)"
url = "https://www.etalab.gouv.fr/licence-ouverte-open-licence/"

[licences.dl-de-by-2]
name = "Datenlizenz Deutschland – Namensnennung – Version 2.0 (dl-de/by-2-0)"
url = "https://www.govdata.de/dl-de/by-2-0"

[licences.geonutzv]
name = "Nutzungsbestimmungen für die Bereitstellung von Geodaten des Bundes (GeoNutzV)"
url = "https://www.gesetze-im-internet.de/geonutzv/"

[licences.sitg-open]
name = "SITG – conditions générales d'utilisation des données et produits du SITG en libre accès (version of 19 May 2026; level A open data; source and modifications must be stated, § 5.3)"
url = "https://opendata.swiss/en/terms-of-use#terms_open"

# Polish PZGiK data (PRG, BDOT10k, EGiB, RCN, ...) are official materials, excluded from
# copyright by art. 4 pkt 2 of the copyright act (cf. NSA II FSK 369/16: geodetic maps are
# official materials). dane.gov.pl labels some datasets "CC BY 4.0" and asks for the PZGiK
# attribution sentence; no statutory basis for that request was found, so the attribution
# is kept as a courtesy. Possible residual: sui generis database right of the state.
[licences.pzgik]
name = "Public domain in effect – Polish official material (art. 4 pkt 2 ustawy o prawie autorskim), PZGiK data made available free of charge (Prawo geodezyjne i kartograficzne)"
url = "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU19940240083"


# ---------------------------------------------------------------- file downloads
[[sample]]
name = "pl-prg-address-points"
axis_order = "x/y"  # verified by scripts/corpus/axis_evidence.py
axis_places = [{ layer = "pl_wojewodztwa", code = "08", why = "source file 08_lubuskie_*.gml (TERYT 08 = lubuskie); prgad:TERYTGminy 08xxxxx" }]
file = "samples/pl/prg-address-points.gml"
source = "example_data/downloads/dane.gov.pl/api.dane.gov.pl/d0e6c516_PRG-punkty_adresowe_6e4326c3.zip"
member = "08_lubuskie_18.09.2026_11.23.44.gml"
rules = ["per_layer=2"]
covers = ["GML 3.2", "several feature types in one file (sequential layers)", "xlink:href feature references (#id)",
          "INSPIRE-style type wrapper (idIIP/AD_IdentyfikatorIIP)", "srsName short form EPSG:2180 in x/y order",
          "datetimes with and without time zone", "empty elements"]
publisher = "Główny Urząd Geodezji i Kartografii (GUGiK)"
dataset = "Państwowy rejestr granic i powierzchni jednostek podziałów terytorialnych kraju (PRG) – punkty adresowe"
dataset_url = "https://dane.gov.pl/pl/dataset/726"
licence = "pzgik"
licence_evidence = "official material, not subject to copyright; https://api.dane.gov.pl/1.4/datasets/726 labels it CC BY 4.0 and states it 'może być wykorzystywany bez ograniczeń' with the PZGiK attribution condition"
attribution = "Wykorzystano/opracowano na podstawie materiałów państwowego zasobu geodezyjnego i kartograficznego (GUGiK, PRG, dane.gov.pl)"

